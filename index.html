<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>G Developments — Quarterly Journal</title>
    <meta name="description" content="Stories, progress and ideas from across G Developments." />
    <meta name="theme-color" content="#111111" />
    <!-- Internal journal: keep it out of search results. Link previews still work. -->
    <meta name="robots" content="noindex, nofollow" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Slack, Teams, WhatsApp, LinkedIn, iMessage, email).
         __SITE_URL__ is filled in at build time from VITE_SITE_URL; previews need absolute URLs. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="G Developments" />
    <meta property="og:title" content="G Developments — Quarterly Journal" />
    <meta property="og:description" content="Stories, progress and ideas from across G Developments." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/share-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="G Developments Quarterly Journal: people walking through a sunlit atrium overlooking the city" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="G Developments — Quarterly Journal" />
